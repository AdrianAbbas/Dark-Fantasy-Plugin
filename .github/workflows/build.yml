name: Native build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure AU, VST3 and standalone (Apple Silicon)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build native formats
        run: cmake --build build --parallel 3
      - name: Regression tests
        run: ctest --test-dir build --output-on-failure
      - name: Register and validate AU (arm64)
        run: bash scripts/validate-au-macos.sh
      - name: Package available macOS bundles
        if: always()
        run: |
          mkdir -p dist
          for format in AU VST3 Standalone; do
            case "$format" in
              AU) bundle=VEIL.component ;;
              VST3) bundle=VEIL.vst3 ;;
              Standalone) bundle=VEIL.app ;;
            esac
            source="build/VEIL_artefacts/Release/$format/$bundle"
            if [[ -d "$source" ]]; then
              ditto -c -k --sequesterRsrc --keepParent "$source" "dist/VEIL-macOS-arm64-$format.zip"
            fi
          done
      - name: Upload macOS bundles even if validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-macOS-arm64-unsigned
          path: dist/*.zip
          if-no-files-found: warn
      - name: Upload AU validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-macOS-AU-diagnostics
          path: |
            build/au-validation/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: VEIL-Linux-x64
          path: build/VEIL_artefacts/Release/
