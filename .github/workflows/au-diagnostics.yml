name: Recover original AU validation logs
on:
  push:
    branches: [ci/au-diagnostics]
permissions:
  actions: read
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original macOS job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          gh api repos/AdrianAbbas/Dark-Fantasy-Plugin/actions/jobs/120759313834/logs > diagnostics/macos-original-job.log
          gh api repos/AdrianAbbas/Dark-Fantasy-Plugin/actions/runs/40056101232 > diagnostics/original-run.json
          test -s diagnostics/macos-original-job.log
      - name: Preserve logs on diagnostic branch for retrieval
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics
          git commit -m 'Record original macOS AU validation logs'
          git push origin HEAD:ci/au-diagnostics
