name: Recover original AU validation logs
on:
  push:
    branches: [ci/au-diagnostics]
permissions:
  actions: read
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original macOS job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          set +e
          gh api repos/AdrianAbbas/Dark-Fantasy-Plugin/actions/jobs/120759313834/logs > diagnostics/macos-original-job.log 2> diagnostics/job-logs-error.txt
          echo "job_logs_exit=$?" > diagnostics/retrieval-status.txt
          gh api repos/AdrianAbbas/Dark-Fantasy-Plugin/actions/runs/40056101232 > diagnostics/original-run.json 2> diagnostics/run-info-error.txt
          echo "run_info_exit=$?" >> diagnostics/retrieval-status.txt
          gh api repos/AdrianAbbas/Dark-Fantasy-Plugin/actions/runs/40056101232/logs > diagnostics/original-run-logs.zip 2> diagnostics/run-logs-error.txt
          echo "run_logs_exit=$?" >> diagnostics/retrieval-status.txt
      - name: Preserve logs on diagnostic branch for retrieval
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics
          git commit -m 'Record original macOS AU validation logs'
          git push origin HEAD:ci/au-diagnostics
