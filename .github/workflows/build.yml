name: Native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      # The optional Developer ID path runs only when these secrets exist.
      HAS_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and Rosetta
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Configure (universal arm64 + x86_64, macOS 10.15+)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build
        run: cmake --build build --parallel 4
      - name: Processor tests (arm64)
        run: ctest --test-dir build --output-on-failure
      - name: Processor tests (x86_64 under Rosetta)
        run: /usr/bin/arch -x86_64 build/VeilTests_artefacts/Release/VeilTests
      - name: Universal binary and Info.plist gate
        run: bash scripts/ci-check-bundles.sh build/VEIL_artefacts/Release
      - name: Developer ID signing and notarisation (optional, untested)
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash scripts/ci-developer-id.sh build/VEIL_artefacts/Release
      - name: Sign, verify and package
        run: bash scripts/package-mac.sh build/VEIL_artefacts/Release dist
      - name: Build AU host harness
        run: bash scripts/build-au-harness.sh build/VeilAUHarness
      - name: Install a quarantined download with install-mac.sh, then auval and harness (arm64 + x86_64)
        run: bash scripts/ci-user-install-test.sh dist/VEIL-macOS-Universal.zip build/VeilAUHarness build/ci-logs
      # Annotations are readable through the REST API; GitHub keeps at most 10 per step.
      - name: Publish install and arm64 harness logs as annotations
        if: always()
        run: bash scripts/ci-annotate.sh --condense build/ci-logs/quarantine.txt build/ci-logs/install-mac.txt build/ci-logs/harness-arm64.txt
      - name: Publish x86_64 harness and auval logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/auval-*.txt; do
            if [[ -f "$f" ]]; then tail -25 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/harness-x86_64.txt build/ci-logs/auval-*.txt.tail
      - name: Upload installable package (only when every check passed)
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-macOS-Universal
          path: dist/VEIL-macOS-Universal.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-macOS-diagnostics
          path: |
            build/ci-logs/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
  release:
    # Tagged commits (v*) publish the same package as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VEIL-macOS-Universal
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" VEIL-macOS-Universal.zip --repo "$GITHUB_REPOSITORY" --title "VEIL $GITHUB_REF_NAME" --generate-notes
