name: Native build
on: [push, pull_request, workflow_dispatch]
jobs:
  macos:
    if: github.ref != 'refs/heads/ci/au-diagnostics'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure AU, VST3 and standalone (Apple Silicon)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - name: Validate AU
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R build/VEIL_artefacts/Release/AU/VEIL.component "$HOME/Library/Audio/Plug-Ins/Components/"
          auval -v aufx Vel1 Veil
      - uses: actions/upload-artifact@v4
        with:
          name: VEIL-macOS-arm64-unsigned
          path: build/VEIL_artefacts/Release/
  linux:
    if: github.ref != 'refs/heads/ci/au-diagnostics'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: VEIL-Linux-x64
          path: build/VEIL_artefacts/Release/
