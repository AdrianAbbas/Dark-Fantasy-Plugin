name: Validate existing AU bundle without rebuilding
on:
  push:
    branches: [ci/au-diagnostics]
permissions:
  contents: write
jobs:
  registration:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Extract existing Apple Silicon build
        run: |
          mkdir -p build/reused build/au-validation
          ditto -x -k diagnostics/verified-au/VEIL-macOS-arm64-AU.zip build/reused
      - name: Validate existing AU with corrected preflight
        run: |
          set -o pipefail
          bash scripts/validate-au-macos.sh build/reused/VEIL.component build/au-validation 2>&1 | tee build/au-validation/complete.log
      - name: Preserve complete registration diagnostics
        if: always()
        run: |
          mkdir -p diagnostics/reused-au-validation
          cp -R build/au-validation/. diagnostics/reused-au-validation/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/reused-au-validation
          git commit -m 'Record native arm64 AU registration and validation diagnostics'
          git push origin HEAD:ci/au-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VEIL-reused-AU-diagnostics
          path: build/au-validation/
